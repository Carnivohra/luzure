[workspace]
resolver = "3"
members = [
    "crates/luzure",
    "crates/luzure-app",
    "crates/luzure-backend",
    "crates/luzure-ecs",
    "crates/luzure-game",
    "crates/luzure-input",
    "crates/luzure-math",
    "crates/luzure-render",
    "crates/luzure-runtime",
    "crates/luzure-thread",
    "crates/luzure-wgpu",
    "crates/luzure-winit",
    "crates/luzure-world",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Carnivohra <carnivohra@gmail.com>"]
description = "A lightweight and modular MMO-first 3D game engine focused on performance."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Carnivohra/luzure"

[workspace.dependencies]
luzure = { path = "crates/luzure", version = "0.0.1" }
luzure-app = { path = "crates/luzure-app", version = "0.0.1" }
luzure-backend = { path = "crates/luzure-backend", version = "0.0.1" }
luzure-ecs = { path = "crates/luzure-ecs", version = "0.0.1" }
luzure-game = { path = "crates/luzure-game", version = "0.0.1" }
luzure-input = { path = "crates/luzure-input", version = "0.0.1" }
luzure-math = { path = "crates/luzure-math", version = "0.0.1" }
luzure-render = { path = "crates/luzure-render", version = "0.0.1" }
luzure-runtime = { path = "crates/luzure-runtime", version = "0.0.1" }
luzure-thread = { path = "crates/luzure-thread", version = "0.0.1" }
luzure-wgpu = { path = "crates/luzure-wgpu", version = "0.0.1" }
luzure-winit = { path = "crates/luzure-winit", version = "0.0.1" }
luzure-world = { path = "crates/luzure-world", version = "0.0.1" }

bytemuck = { version = "1.25.2", features = ["derive"] }
raw-window-handle = { version = "0.6.2", features = ["alloc"] }
pollster = "1.0.1"
thiserror = "2.0.20"
wgpu = "30.0.1"
winit = "0.30.13"
